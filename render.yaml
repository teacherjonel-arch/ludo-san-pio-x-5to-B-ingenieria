services:
  - type: web
    name: ludo-san-pio-x-5to-b-ingenieria
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ludo-5b-ingenieria-db
          property: connectionString

databases:
  - name: ludo-5b-ingenieria-db
    plan: free
    region: oregon
    databaseName: ludo5b
    user: ludo5b
